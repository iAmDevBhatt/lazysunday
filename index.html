<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>लेज़ी संडे</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- Background crossfade layers (JS controls which is visible) -->
  <div class="bg-layer" id="bg-a" aria-hidden="true"></div>
  <div class="bg-layer" id="bg-b" aria-hidden="true"></div>
  <div class="bg-overlay" aria-hidden="true"></div>

  <!-- Top Bar -->
  <header class="top-bar">
    <div class="top-bar__time" id="clock">00:00</div>

    <div class="top-bar__status">
      <span class="status-dot" aria-hidden="true"></span>
      <span id="online-count">— online</span>
    </div>

    <nav class="top-bar__links" aria-label="External platforms">
      <a href="https://open.spotify.com" target="_blank" rel="noopener" class="ext-link" aria-label="Open Spotify">
        <svg class="ext-link__icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
        </svg>
        Spotify
      </a>
      <a href="https://music.youtube.com" target="_blank" rel="noopener" class="ext-link" aria-label="Open YT Music">
        <svg class="ext-link__icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 0C5.376 0 0 5.376 0 12s5.376 12 12 12 12-5.376 12-12S18.624 0 12 0zm0 19.104c-3.924 0-7.104-3.18-7.104-7.104S8.076 4.896 12 4.896s7.104 3.18 7.104 7.104-3.18 7.104-7.104 7.104zm0-13.332c-3.432 0-6.228 2.796-6.228 6.228S8.568 18.228 12 18.228s6.228-2.796 6.228-6.228S15.432 5.772 12 5.772zM9.684 15.54V8.46L15.816 12l-6.132 3.54z"/>
        </svg>
        YT Music
      </a>
    </nav>
  </header>

  <!-- Hero -->
  <main class="hero" role="main">
    <h1 class="hero__title" lang="hi"></h1>
    <p class="hero__subtitle">Retro Vibes &bull; Pure Sound</p>
  </main>

  <!-- Audio Player -->
  <div class="player" role="region" aria-label="Audio Player">
    <div class="player__inner">

      <!-- Album Art -->
      <div class="player__art-wrap">
        <img class="player__art" id="album-art" src="covers/default.jpg" alt="Album art" />
      </div>

      <!-- Track Info -->
      <div class="player__info">
        <p class="player__track" id="track-title">Track Title</p>
        <p class="player__artist" id="track-artist">Artist Name</p>
      </div>

      <!-- Controls -->
      <div class="player__controls">
        <div class="player__buttons">
          <button class="ctrl-btn ctrl-btn--prev" id="btn-prev" aria-label="Previous track">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>
            </svg>
          </button>

          <button class="ctrl-btn ctrl-btn--play" id="btn-play" aria-label="Play">
            <!-- Play icon -->
            <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M8 5v14l11-7z"/>
            </svg>
            <!-- Pause icon -->
            <svg class="icon-pause hidden" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
            </svg>
          </button>

          <button class="ctrl-btn ctrl-btn--next" id="btn-next" aria-label="Next track">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M6 18l8.5-6L6 6v12zm2-8.14 5.44 2.14L8 14.14V9.86zM16 6h2v12h-2z"/>
            </svg>
          </button>
        </div>

        <!-- Progress Bar -->
        <div class="player__progress-wrap">
          <span class="player__time" id="time-current">0:00</span>
          <div class="player__progress" id="progress-bar" role="slider"
               aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"
               tabindex="0">
            <div class="player__progress-fill" id="progress-fill"></div>
            <div class="player__progress-thumb" id="progress-thumb"></div>
          </div>
          <span class="player__time" id="time-total">0:00</span>
        </div>
      </div>

    </div>
  </div>

  <!-- Hidden audio element -->
  <audio id="audio" preload="metadata" aria-hidden="true"></audio>

  <script src="app.js"></script>
</body>
</html>
